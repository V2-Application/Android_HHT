apply plugin: 'com.android.application'

// Every build installed on devices must be signed with the same V2Retail key,
// otherwise Android rejects updates and the old app has to be uninstalled first.
// Keystore lookup order: KEYSTORE_PATH env var -> v2retail.keystore.path in local.properties -> <project>/keystore/V2Retail_keystore
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def v2KeystoreFile = [
        System.getenv("KEYSTORE_PATH"),
        localProps.getProperty("v2retail.keystore.path"),
        rootProject.file("keystore/V2Retail_keystore").absolutePath,
        '/Users/maddy/Projects/V2Retail_at_456_keystore'
].findAll { it }.collect { file(it) }.find { it.exists() }

if (v2KeystoreFile == null) {
    logger.warn("WARNING: V2Retail keystore not found. Builds will use the local debug key and " +
            "cannot update an app installed from the official release APK. " +
            "Set KEYSTORE_PATH or v2retail.keystore.path in local.properties.")
}

android {
    compileSdk 31
    defaultConfig {
        applicationId "com.v2retail.dotvik"
        minSdkVersion 25
        targetSdkVersion 31
        versionCode 1302
        versionName "13.002"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
        aaptOptions {
            cruncherEnabled = false
        }

        buildConfigField "boolean", "ENABLE_V11_V01", "true"
        buildConfigField "String", "SAP_DEV_HOST", "\"192.168.144.174\""
    }

    buildFeatures {
        buildConfig = true
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def versionName = variant.versionName.replace('.', '_')
            def customText = "V2_HHT_Azure"
            def newName = "${customText}_${versionName}.apk"
            outputFileName = newName
        }
    }
    signingConfigs {
        release {
            if (v2KeystoreFile != null) {
                storeFile v2KeystoreFile
            }
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'V2Retail@456'
            keyAlias System.getenv("KEY_ALIAS") ?: 'v2retail'
            keyPassword System.getenv("KEY_PASSWORD") ?: 'V2Retail@456'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (v2KeystoreFile != null) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    dependenciesInfo {
        includeInApk true
        includeInBundle true
    }
    ndkVersion '21.3.6528147'
    namespace 'com.v2retail.dotvik'
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation fileTree(dir: "$buildDir/native-libs", include: 'native-libs.jar')
    def room_version = "2.4.3"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-rxjava3:$room_version"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.3'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation 'com.journeyapps:zxing-android-embedded:4.2.0'
    implementation 'com.google.zxing:core:3.4.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    implementation 'com.google.mlkit:barcode-scanning:17.0.0'
    implementation "androidx.lifecycle:lifecycle-livedata:2.4.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.4.0"
    implementation("androidx.camera:camera-camera2:1.0.2")
    implementation("androidx.camera:camera-lifecycle:1.0.2")
    implementation("androidx.camera:camera-view:1.0.0-alpha30")
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation files('libs/xUtils-2.5.5.jar')
    implementation files('libs/jxl.jar')
    implementation files('libs/cw-deviceapi20191022.jar')
    implementation 'io.sentry:sentry-android:5.5.2'
}
